name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build for Linux AMD64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/build.sh linux-amd64
          cd build/linux-amd64
          tar -czvf ../platex-linux-amd64.tar.gz ./*
          cd ../../

      - name: Build for Linux ARM64
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          bash scripts/build.sh linux-arm64
          cd build/linux-arm64
          tar -czvf ../platex-linux-arm64.tar.gz ./*
          cd ../../

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/platex-linux-amd64.tar.gz
            build/platex-linux-arm64.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for CPU image
        id: meta_cpu
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}-cpu
            type=raw,value=cpu

      - name: Extract metadata for CUDA11 image
        id: meta_cuda11
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}-cuda11
            type=raw,value=cuda11

      - name: Extract metadata for CUDA12 image
        id: meta_cuda12
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}-cuda12
            type=raw,value=cuda12

      - name: Build and push CPU image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ORT_GPU_VARIANT=cpu
          tags: ${{ steps.meta_cpu.outputs.tags }}
          labels: ${{ steps.meta_cpu.outputs.labels }}

      - name: Build and push CUDA11 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ORT_GPU_VARIANT=cuda11
          tags: ${{ steps.meta_cuda11.outputs.tags }}
          labels: ${{ steps.meta_cuda11.outputs.labels }}

      - name: Build and push CUDA12 image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ORT_GPU_VARIANT=cuda12
          tags: ${{ steps.meta_cuda12.outputs.tags }}
          labels: ${{ steps.meta_cuda12.outputs.labels }}
